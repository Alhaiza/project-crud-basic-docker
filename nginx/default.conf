# ==============================================================================
# KONFIGURASI NGINX INGRESS REVERSE PROXY & GATEWAY ROUTER (CRUD-DOCKER)
# ==============================================================================
# INI APA: Berkas konfigurasi web server Nginx yang bertindak sebagai Reverse Proxy
#          dan Single Gateway (Ingress) untuk seluruh stack aplikasi monorepo.
# KENAPA: Tanpa Nginx Ingress, frontend dan backend harus diekspos dengan port berbeda
#         (misal 3000 dan 8000), memicu isu CORS dan masalah cookie keamanan cross-site.
# UNTUK APA & BAGAIMANA:
#   - Menyatukan port publik ke port 80 (HTTP standar).
#   - Menganalisis URI permintaan HTTP:
#       * Awalan '/api/*' diarahkan ke PHP-FPM Backend (port 9000) via FastCGI.
#       * Sisa rute lainnya '/*' diarahkan ke Nuxt 4 Nitro Frontend (port 3000) via HTTP proxy.
# ==============================================================================

server {
    # INI APA: Port dan nama host yang didengarkan oleh Nginx di dalam kontainer.
    # KENAPA: Port 80 adalah port default komunikasi HTTP web peramban.
    # BAGAIMANA: Menerima setiap traffic yang masuk ke localhost atau IP server.
    listen 80;
    server_name localhost;

    # INI APA: Batasan ukuran maksimal payload request body (berkas upload / form data).
    # KENAPA: Nginx default hanya mengizinkan upload 1 MB (bisa memicu HTTP 413 Payload Too Large).
    # UNTUK APA & BAGAIMANA: Ditetapkan ke 64M agar upload media/gambar katalog berjalan mulus.
    client_max_body_size 64M;

    # INI APA: Lokasi penulisan log transaksi lalu lintas web dan log galat sistem.
    # KENAPA: Memudahkan debugging dan audit traffic secara realtime lewat 'docker compose logs nginx'.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # --------------------------------------------------------------------------
    # 1. ROUTING BACKEND LARAVEL REST API (/api/*)
    # --------------------------------------------------------------------------
    # INI APA: Blok routing khusus untuk semua URI yang diawali dengan prefix '/api'.
    # KENAPA: Memisahkan jalur data bisnis (JSON API) dari permintaan tampilan halaman (HTML/JS).
    # UNTUK APA & BAGAIMANA:
    #   - 'root' mengarah ke direktori '/var/www/html/public' tempat file 'index.php' Laravel berada.
    #   - 'try_files' mencoba mencari file statis fisik terlebih dahulu. Jika tidak ada,
    #     alihkan request ke '/index.php' lengkap dengan argumen query string ($is_args$args).
    # --------------------------------------------------------------------------
    location ~ ^/api {
        root /var/www/html/public;
        try_files $uri /index.php$is_args$args;
    }

    # --------------------------------------------------------------------------
    # 2. EKSEKUSI PROSESOR PHP VIA FASTCGI (FastCGI Process Manager)
    # --------------------------------------------------------------------------
    # INI APA: Blok pemroses skrip biner PHP saat 'index.php' dipanggil oleh rute Laravel.
    # KENAPA: Nginx tidak bisa mengeksekusi kode PHP secara langsung; Nginx butuh FastCGI
    #         bridge untuk meneruskan skrip ke PHP-FPM (backend service).
    # UNTUK APA & BAGAIMANA:
    #   - 'fastcgi_pass backend:9000': Menghubungi service 'backend' pada port 9000 via jaringan Docker internal.
    #   - 'SCRIPT_FILENAME': Memberi tahu PHP-FPM lokasi absolut file PHP di kontainer backend.
    #   - 'HTTP_AUTHORIZATION': Meneruskan Bearer Token autentikasi Sanctum dari header request klien.
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 300;
    }

    # --------------------------------------------------------------------------
    # 3. ROUTING FRONTEND NUXT 4 (Single Page Application / SSR)
    # --------------------------------------------------------------------------
    # INI APA: Fallback routing untuk semua rute non-API (katalog produk, login page, assets).
    # KENAPA: Nuxt 4 bertindak sebagai penyaji antarmuka visual dan logika peramban pengguna.
    # UNTUK APA & BAGAIMANA:
    #   - 'proxy_pass http://frontend:3000': Meneruskan seluruh permintaan HTTP ke service Nuxt Nitro.
    #   - 'Upgrade' & 'Connection': Mendukung protokol WebSocket (misal HMR / fitur realtime).
    #   - 'X-Real-IP' & 'X-Forwarded-*': Meneruskan IP riil klien asli ke Nuxt/Nitro server.
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }
}
